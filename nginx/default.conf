server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Weiterleitungen relativ halten. Caddy davor übernimmt die Verschlüsselung,
    # sonst baut nginx http:// Adressen.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Versteckte Dateien nie ausliefern
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;

        # Die Seite soll sich nach einem Update sofort aktualisieren.
        # Alle Header stehen hier, weil add_header in einem location die Header von server überschreibt.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
